<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — MYAZZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!-- Config + Client (chargés APRÈS la librairie) -->
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<style>
  :root{
    --black:#0a0a09; --black-2:#131311; --black-3:#1b1b18;
    --white:#f7f6f2; --ivory:#e9e3d4; --silver:#9d9c94; --silver-dim:#6b6a63;
    --line:#2b2b26; --purple:#f4f2ea; --purple-dim:#8c8b83;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--black); color:var(--white); font-family:'Manrope',sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px;
  }
  .auth-container{
    width:100%; max-width:420px;
    background:var(--black-2); border:1px solid var(--line); border-radius:24px;
    padding:48px 36px;
  }
  .auth-logo{
    font-family:'Manrope',sans-serif; font-weight:800; letter-spacing:0.14em;
    font-size:22px; color:var(--white); text-transform:uppercase; text-align:center; margin-bottom:8px;
  }
  .auth-subtitle{
    text-align:center; color:var(--silver); font-size:14px; margin-bottom:36px;
  }
  .auth-field{ margin-bottom:18px; }
  .auth-field label{
    display:block; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--silver-dim); margin-bottom:8px;
  }
  .auth-field input{
    width:100%; background:var(--black); border:1px solid var(--line); border-radius:12px;
    color:var(--white); font-family:'Manrope',sans-serif; font-size:14px; padding:13px 15px;
    outline:none; transition:border-color .25s;
  }
  .auth-field input:focus{ border-color:var(--purple); }
  .auth-btn{
    width:100%; margin-top:8px; padding:15px; border-radius:999px; background:var(--white); color:var(--black);
    border:none; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    cursor:pointer; transition:background .3s, transform .3s; font-weight:600;
  }
  .auth-btn:hover{ background:var(--purple); transform:translateY(-2px); }
  .auth-btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
  .auth-footer{
    text-align:center; margin-top:28px; color:var(--silver); font-size:13px;
  }
  .auth-footer a{ color:var(--white); text-decoration:none; border-bottom:1px solid transparent; transition:border-color .3s; }
  .auth-footer a:hover{ border-bottom-color:var(--white); }
  .auth-error{
    background:rgba(220,50,50,0.12); border:1px solid rgba(220,50,50,0.35); color:#e66;
    padding:12px 16px; border-radius:12px; font-size:13px; margin-bottom:18px; display:none;
  }
  .auth-error.show{ display:block; }
  .auth-success{
    background:rgba(50,180,80,0.12); border:1px solid rgba(50,180,80,0.35); color:#8d8;
    padding:12px 16px; border-radius:12px; font-size:13px; margin-bottom:18px; display:none;
  }
  .auth-success.show{ display:block; }
  .back-link{
    display:inline-flex; align-items:center; gap:8px; color:var(--silver); text-decoration:none;
    font-size:13px; margin-bottom:32px; transition:color .25s;
  }
  .back-link:hover{ color:var(--white); }
  @media (max-width:480px){
    .auth-container{ padding:36px 24px; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  Retour à l'accueil
</a>

<div class="auth-container">
  <div class="auth-logo">MYAZZ</div>
  <div class="auth-subtitle">Connectez-vous à votre compte</div>

  <div class="auth-error" id="authError"></div>
  <div class="auth-success" id="authSuccess"></div>

  <form id="loginForm" method="POST" action="" onsubmit="return false;" autocomplete="on">
    <div class="auth-field">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" name="email" placeholder="vous@exemple.com" required autocomplete="email">
    </div>
    <div class="auth-field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6" autocomplete="current-password">
    </div>
    <button type="submit" class="auth-btn" id="loginBtn">Se connecter</button>
  </form>

  <div class="auth-footer">
    Pas encore de compte ? <a href="register.html">Créer un compte</a>
  </div>
</div>

<script>
(function(){
  'use strict';

  var form     = document.getElementById('loginForm');
  var btn      = document.getElementById('loginBtn');
  var errorEl  = document.getElementById('authError');
  var successEl= document.getElementById('authSuccess');

  if (!form || !btn) {
    console.error('[MYAZZ] Formulaire ou bouton introuvable.');
    return;
  }

  /* ---- Auth check (non bloquant) ---- */
  waitForSupabase(10, function(err, client) {
    if (err) {
      console.error('[MYAZZ] Auth check impossible:', err);
      return;
    }
    client.auth.getUser().then(function(res) {
      if (res.data && res.data.user) {
        console.log('[MYAZZ] Utilisateur déjà connecté, redirection...');
        var params = new URLSearchParams(window.location.search);
        window.location.href = params.get('redirect') || 'index.html';
      }
    }).catch(function(e) {
      console.error('[MYAZZ] Auth check error:', e);
    });
  });

  /* ---- Soumission du formulaire ---- */
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    e.stopPropagation();
    errorEl.classList.remove('show');
    successEl.classList.remove('show');

    var email = form.email.value.trim();
    var password = form.password.value;

    btn.disabled = true;
    var originalText = btn.textContent;
    btn.textContent = 'Connexion...';

    waitForSupabase(10, function(err, client) {
      if (err) {
        console.error('[MYAZZ] Connexion impossible:', err);
        errorEl.textContent = err.message;
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = originalText;
        return;
      }

      client.auth.signInWithPassword({ email: email, password: password })
        .then(function(res) {
          if (res.error) {
            var msg = formatAuthError(res.error);
            errorEl.textContent = msg;
            errorEl.classList.add('show');
            btn.disabled = false;
            btn.textContent = originalText;
            return;
          }

          successEl.textContent = 'Connexion réussie ! Redirection...';
          successEl.classList.add('show');

          var params = new URLSearchParams(window.location.search);
          setTimeout(function() {
            window.location.href = params.get('redirect') || 'index.html';
          }, 800);
        })
        .catch(function(err) {
          console.error('[MYAZZ] Login error:', err);
          errorEl.textContent = formatAuthError(err);
          errorEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = originalText;
        });
    });
  });

  function formatAuthError(error) {
    var code = error && (error.code || error.error_code);
    var message = error && error.message ? error.message : '';
    if (code === 'email_not_confirmed' || /email not confirmed/i.test(message)) {
      return 'Veuillez confirmer votre e-mail avant de vous connecter.';
    }
    if (code === 'invalid_credentials' || /invalid login credentials/i.test(message)) {
      return 'E-mail ou mot de passe incorrect.';
    }
    return message || 'Une erreur est survenue. Vérifiez votre connexion et réessayez.';
  }

  console.log('[MYAZZ] Login form initialized.');
})();
</script>
</body>
</html>
