<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription — MYAZZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!-- Config + Client -->
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<style>
  :root{
    --black:#0a0a09; --black-2:#131311; --black-3:#1b1b18;
    --white:#f7f6f2; --ivory:#e9e3d4; --silver:#9d9c94; --silver-dim:#6b6a63;
    --line:#2b2b26; --purple:#f4f2ea; --purple-dim:#8c8b83;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--black); color:var(--white); font-family:'Manrope',sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px;
  }
  .auth-container{
    width:100%; max-width:420px;
    background:var(--black-2); border:1px solid var(--line); border-radius:24px;
    padding:48px 36px;
  }
  .auth-logo{
    font-family:'Manrope',sans-serif; font-weight:800; letter-spacing:0.14em;
    font-size:22px; color:var(--white); text-transform:uppercase; text-align:center; margin-bottom:8px;
  }
  .auth-subtitle{
    text-align:center; color:var(--silver); font-size:14px; margin-bottom:36px;
  }
  .auth-field{ margin-bottom:18px; }
  .auth-field label{
    display:block; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--silver-dim); margin-bottom:8px;
  }
  .auth-field input{
    width:100%; background:var(--black); border:1px solid var(--line); border-radius:12px;
    color:var(--white); font-family:'Manrope',sans-serif; font-size:14px; padding:13px 15px;
    outline:none; transition:border-color .25s;
    -webkit-appearance:none; appearance:none;
  }
  .auth-field select{
    width:100%; background:var(--black); border:1px solid var(--line); border-radius:12px;
    color:var(--white); font-family:'Manrope',sans-serif; font-size:14px; padding:13px 15px;
    outline:none; transition:border-color .25s;
    cursor:pointer;
  }
  .auth-field select option{
    background:var(--black-2); color:var(--white);
    font-family:'Manrope',sans-serif; font-size:14px;
  }
  .auth-field select option:checked{
    background:var(--line); color:var(--white);
  }
  .auth-field select:focus{ border-color:var(--purple); }
  .auth-btn{
    width:100%; margin-top:8px; padding:15px; border-radius:999px; background:var(--white); color:var(--black);
    border:none; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    cursor:pointer; transition:background .3s, transform .3s; font-weight:600;
  }
  .auth-btn:hover{ background:var(--purple); transform:translateY(-2px); }
  .auth-btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
  .auth-footer{
    text-align:center; margin-top:28px; color:var(--silver); font-size:13px;
  }
  .auth-footer a{ color:var(--white); text-decoration:none; border-bottom:1px solid transparent; transition:border-color .3s; }
  .auth-footer a:hover{ border-bottom-color:var(--white); }
  .auth-error{
    background:rgba(220,50,50,0.12); border:1px solid rgba(220,50,50,0.35); color:#e66;
    padding:12px 16px; border-radius:12px; font-size:13px; margin-bottom:18px; display:none;
  }
  .auth-error.show{ display:block; }
  .auth-success{
    background:rgba(50,180,80,0.12); border:1px solid rgba(50,180,80,0.35); color:#8d8;
    padding:12px 16px; border-radius:12px; font-size:13px; margin-bottom:18px; display:none;
  }
  .auth-success.show{ display:block; }
  .back-link{
    display:inline-flex; align-items:center; gap:8px; color:var(--silver); text-decoration:none;
    font-size:13px; margin-bottom:32px; transition:color .25s;
  }
  .back-link:hover{ color:var(--white); }
  @media (max-width:480px){
    .auth-container{ padding:36px 24px; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  Retour à l'accueil
</a>

<div class="auth-container">
  <div class="auth-logo">MYAZZ</div>
  <div class="auth-subtitle">Créez votre compte MYAZZ</div>

  <div class="auth-error" id="authError"></div>
  <div class="auth-success" id="authSuccess"></div>

  <form id="registerForm" method="POST" action="" onsubmit="return false;" autocomplete="on">
    <div class="auth-field">
      <label for="fullName">Nom complet</label>
      <input type="text" id="fullName" name="fullName" placeholder="Votre nom et prénom" required autocomplete="name">
    </div>
    <div class="auth-field">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" name="email" placeholder="vous@exemple.com" required autocomplete="email">
    </div>
    <div class="auth-field">
      <label for="phone">Téléphone</label>
      <input type="tel" id="phone" name="phone" placeholder="0X XX XX XX XX" required autocomplete="tel">
    </div>
    <div class="auth-field">
      <label for="wilaya">Wilaya</label>
      <select id="wilaya" name="wilaya" required>
        <option value="" disabled selected>Sélectionnez votre wilaya</option>
      </select>
    </div>
    <div class="auth-field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
    </div>
    <button type="submit" class="auth-btn" id="registerBtn">Créer mon compte</button>
  </form>

  <div class="auth-footer">
    Déjà un compte ? <a href="login.html">Se connecter</a>
  </div>
</div>

<script>
/* ================================================================
   1. PEUPLER LES WILAYAS (synchrone, immédiat, fallback inline)
   ================================================================ */
(function populateWilayas(){
  var select = document.getElementById('wilaya');
  if (!select) return;
  var wilayas = [
    "01 - Adrar","02 - Chlef","03 - Laghouat","04 - Oum El Bouaghi","05 - Batna",
    "06 - Béjaïa","07 - Biskra","08 - Béchar","09 - Blida","10 - Bouira",
    "11 - Tamanrasset","12 - Tébessa","13 - Tlemcen","14 - Tiaret","15 - Tizi Ouzou",
    "16 - Alger","17 - Djelfa","18 - Jijel","19 - Sétif","20 - Saïda",
    "21 - Skikda","22 - Sidi Bel Abbès","23 - Annaba","24 - Guelma","25 - Constantine",
    "26 - Médéa","27 - Mostaganem","28 - M'Sila","29 - Mascara","30 - Ouargla",
    "31 - Oran","32 - El Bayadh","33 - Illizi","34 - Bordj Bou Arréridj","35 - Boumerdès",
    "36 - El Tarf","37 - Tindouf","38 - Tissemsilt","39 - El Oued","40 - Khenchela",
    "41 - Souk Ahras","42 - Tipaza","43 - Mila","44 - Aïn Defla","45 - Naâma",
    "46 - Aïn Témouchent","47 - Ghardaïa","48 - Relizane","49 - Timimoun","50 - Bordj Badji Mokhtar",
    "51 - Ouled Djellal","52 - Béni Abbès","53 - In Salah","54 - In Guezzam","55 - Touggourt",
    "56 - Djanet","57 - El M'Ghair","58 - El Meniaa"
  ];
  wilayas.forEach(function(w){
    var opt = document.createElement('option');
    opt.value = w;
    opt.textContent = w;
    select.appendChild(opt);
  });
})();

/* ================================================================
   2. LOGIQUE DE SOUMISSION SÉCURISÉE
   ================================================================ */
(function(){
  'use strict';

  var form     = document.getElementById('registerForm');
  var btn      = document.getElementById('registerBtn');
  var errorEl  = document.getElementById('authError');
  var successEl= document.getElementById('authSuccess');

  if (!form || !btn) {
    console.error('[MYAZZ] Formulaire ou bouton introuvable.');
    return;
  }

  /* ---- Auth check (non bloquant) ---- */
  if (typeof waitForSupabase === 'function') {
    waitForSupabase(10, function(err, client) {
      if (err || !client) return;
      client.auth.getUser().then(function(res) {
        if (res.data && res.data.user) {
          console.log('[MYAZZ] Utilisateur déjà connecté, redirection...');
          window.location.href = 'index.html';
        }
      }).catch(function(e) {
        console.error('[MYAZZ] Auth check error:', e);
      });
    });
  }

  /* ---- Handler principal ---- */
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    e.stopPropagation();
    errorEl.classList.remove('show');
    successEl.classList.remove('show');

    var fullName = form.fullName.value.trim();
    var email    = form.email.value.trim();
    var phone    = form.phone.value.trim();
    var wilaya   = form.wilaya.value;
    var password = form.password.value;

    if (!wilaya) {
      errorEl.textContent = 'Veuillez sélectionner une wilaya.';
      errorEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    var originalText = btn.textContent;
    btn.textContent = 'Création en cours...';

    // Vérifier que waitForSupabase existe
    if (typeof waitForSupabase !== 'function') {
      console.error('[MYAZZ] waitForSupabase non disponible. Vérifiez que supabase-client.js est chargé.');
      errorEl.textContent = 'Erreur de chargement du service. Veuillez rafraîchir la page.';
      errorEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = originalText;
      return;
    }

    waitForSupabase(10, function(err, client) {
      if (err) {
        console.error('[MYAZZ] Connexion impossible:', err);
        errorEl.textContent = err.message;
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = originalText;
        return;
      }

      client.auth.signUp({
        email: email,
        password: password,
        options: {
          data: { full_name: fullName }
        }
      })
      .then(function(res) {
        if (res.error) {
          var msg = res.error.message;
          if (msg.includes('already registered') || msg.includes('User already registered')) {
            msg = 'Cet e-mail est déjà utilisé. Essayez de vous connecter.';
          } else if (msg.includes('Password should be')) {
            msg = 'Le mot de passe est trop faible. Utilisez au moins 6 caractères.';
          } else if (msg.includes('valid email')) {
            msg = 'Veuillez entrer une adresse e-mail valide.';
          }
          errorEl.textContent = msg;
          errorEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = originalText;
          return;
        }

        // Mise à jour du profil
        if (res.data && res.data.user) {
          client.from('profiles')
            .update({ phone: phone, wilaya: wilaya })
            .eq('id', res.data.user.id)
            .then(function(profileRes) {
              if (profileRes.error) {
                console.warn('[MYAZZ] Profile update warning:', profileRes.error);
              }
            });
        }

        successEl.textContent = 'Compte créé avec succès ! Vérifiez votre e-mail pour confirmer votre inscription.';
        successEl.classList.add('show');
        form.reset();
        btn.disabled = false;
        btn.textContent = originalText;
      })
      .catch(function(err) {
        console.error('[MYAZZ] Registration error:', err);
        errorEl.textContent = 'Une erreur inattendue est survenue. Veuillez réessayer.';
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = originalText;
      });
    });
  });

  console.log('[MYAZZ] Register form initialized.');
})();
</script>
</body>
</html>
