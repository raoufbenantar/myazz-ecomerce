<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — MYAZZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<style>
  :root{
    --black:#0a0a09; --black-2:#131311; --black-3:#1b1b18;
    --white:#f7f6f2; --ivory:#e9e3d4; --silver:#9d9c94; --silver-dim:#6b6a63;
    --line:#2b2b26; --purple:#f4f2ea; --purple-dim:#8c8b83;
    --success:#4caf50; --warning:#ff9800; --danger:#f44336;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--black); color:var(--white); font-family:'Manrope',sans-serif;
    min-height:100vh;
  }
  .admin-nav{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 32px;
    background:rgba(10,10,9,0.92); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .admin-nav .logo{
    font-family:'Manrope',sans-serif; font-weight:800; letter-spacing:0.14em;
    font-size:18px; color:var(--white); text-transform:uppercase;
  }
  .admin-nav-right{ display:flex; align-items:center; gap:20px; }
  .admin-nav a, .admin-nav button{
    color:var(--silver); text-decoration:none; font-size:13px; background:none; border:none; cursor:pointer;
    transition:color .25s;
  }
  .admin-nav a:hover, .admin-nav button:hover{ color:var(--white); }

  .admin-layout{
    display:grid; grid-template-columns:240px 1fr;
    padding-top:64px; min-height:100vh;
  }
  .admin-sidebar{
    position:fixed; top:64px; left:0; bottom:0; width:240px;
    background:var(--black-2); border-right:1px solid var(--line);
    padding:24px 0;
  }
  .sidebar-link{
    display:flex; align-items:center; gap:12px;
    padding:12px 24px; color:var(--silver); text-decoration:none; font-size:14px;
    transition:background .2s, color .2s; border-left:2px solid transparent;
  }
  .sidebar-link:hover, .sidebar-link.active{
    background:rgba(244,242,234,0.04); color:var(--white); border-left-color:var(--purple);
  }
  .sidebar-link svg{ width:18px; height:18px; flex-shrink:0; }

  .admin-main{
    margin-left:240px; padding:32px;
  }

  .stats-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-bottom:36px;
  }
  .stat-card{
    background:var(--black-2); border:1px solid var(--line); border-radius:16px;
    padding:24px;
  }
  .stat-label{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--silver-dim); margin-bottom:10px;
  }
  .stat-value{
    font-family:'Fraunces',serif; font-size:28px; color:var(--white);
  }

  .section-title{
    font-family:'Fraunces',serif; font-size:22px; margin-bottom:20px;
  }

  .data-table{
    width:100%; border-collapse:collapse; font-size:14px;
    background:var(--black-2); border:1px solid var(--line); border-radius:16px; overflow:hidden;
  }
  .data-table th{
    text-align:left; padding:14px 18px; background:rgba(244,242,234,0.03);
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--silver-dim); font-weight:500;
    border-bottom:1px solid var(--line);
  }
  .data-table td{
    padding:14px 18px; border-bottom:1px solid var(--line); color:var(--silver);
  }
  .data-table tr:last-child td{ border-bottom:none; }
  .data-table tr:hover td{ background:rgba(244,242,234,0.02); }

  .status-badge{
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600;
    font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.04em;
  }
  .status-pending{ background:rgba(255,152,0,0.12); color:var(--warning); }
  .status-confirmed{ background:rgba(76,175,80,0.12); color:var(--success); }
  .status-shipped{ background:rgba(33,150,243,0.12); color:#64b5f6; }
  .status-delivered{ background:rgba(76,175,80,0.18); color:#81c784; }
  .status-cancelled{ background:rgba(244,67,54,0.12); color:var(--danger); }

  .btn-sm{
    padding:6px 14px; border-radius:999px; background:var(--white); color:var(--black);
    border:none; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.04em;
    cursor:pointer; transition:background .25s;
  }
  .btn-sm:hover{ background:var(--purple); }
  .btn-ghost{
    background:transparent; color:var(--white); border:1px solid var(--line);
  }
  .btn-ghost:hover{ background:rgba(244,242,234,0.06); }

  .order-detail-modal{
    position:fixed; inset:0; z-index:100;
    background:rgba(8,8,7,0.85); backdrop-filter:blur(14px);
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  .order-detail-modal.open{ display:flex; }
  .order-detail-content{
    width:100%; max-width:600px; max-height:90vh; overflow:auto;
    background:var(--black-2); border:1px solid var(--line); border-radius:24px;
    padding:32px;
  }
  .order-detail-header{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;
  }
  .order-detail-header h3{ font-family:'Fraunces',serif; font-size:20px; }
  .order-detail-close{
    background:none; border:none; color:var(--silver); cursor:pointer;
  }
  .order-detail-close:hover{ color:var(--white); }

  .detail-row{
    display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .detail-row:last-child{ border-bottom:none; }
  .detail-row span:first-child{ color:var(--silver-dim); }
  .detail-row span:last-child{ color:var(--white); }

  .detail-items{ margin-top:20px; }
  .detail-items h4{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--silver-dim); margin-bottom:12px;
  }
  .detail-item{
    display:flex; justify-content:space-between; padding:10px 0;
    border-bottom:1px solid var(--line); font-size:14px;
  }

  .tab-bar{
    display:flex; gap:8px; margin-bottom:24px;
  }
  .tab-btn{
    padding:8px 16px; border-radius:999px; background:transparent; color:var(--silver);
    border:1px solid var(--line); cursor:pointer; font-size:13px; transition:all .25s;
  }
  .tab-btn.active{ background:var(--white); color:var(--black); border-color:var(--white); }

  @media (max-width:900px){
    .admin-layout{ grid-template-columns:1fr; }
    .admin-sidebar{ display:none; }
    .admin-main{ margin-left:0; }
    .stats-grid{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:640px){
    .stats-grid{ grid-template-columns:1fr; }
    .admin-main{ padding:20px; }
    .data-table{ font-size:12px; }
    .data-table th, .data-table td{ padding:10px 12px; }
  }
</style>
</head>
<body>

<nav class="admin-nav">
  <div class="logo">MYAZZ Admin</div>
  <div class="admin-nav-right">
    <a href="index.html">Voir le site</a>
    <button id="logoutBtn">Déconnexion</button>
  </div>
</nav>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <a href="#orders" class="sidebar-link active" data-tab="orders">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L4.5 3H2"/><circle cx="9.5" cy="19.5" r="1.5"/><circle cx="16.5" cy="19.5" r="1.5"/></svg>
      Commandes
    </a>
    <a href="#products" class="sidebar-link" data-tab="products">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>
      Produits
    </a>
  </aside>

  <main class="admin-main">
    <!-- Orders Tab -->
    <div id="ordersTab">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Commandes totales</div>
          <div class="stat-value" id="statTotalOrders">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Chiffre d'affaires</div>
          <div class="stat-value" id="statRevenue">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">En attente</div>
          <div class="stat-value" id="statPending">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Produits</div>
          <div class="stat-value" id="statProducts">—</div>
        </div>
      </div>

      <div class="tab-bar">
        <button class="tab-btn active" data-filter="all">Toutes</button>
        <button class="tab-btn" data-filter="pending">En attente</button>
        <button class="tab-btn" data-filter="confirmed">Confirmées</button>
        <button class="tab-btn" data-filter="shipped">Expédiées</button>
        <button class="tab-btn" data-filter="delivered">Livrées</button>
        <button class="tab-btn" data-filter="cancelled">Annulées</button>
      </div>

      <h2 class="section-title">Commandes</h2>
      <div style="overflow-x:auto;">
        <table class="data-table" id="ordersTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Client</th>
              <th>Téléphone</th>
              <th>Wilaya</th>
              <th>Montant</th>
              <th>Statut</th>
              <th>Date</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="ordersBody">
            <tr><td colspan="8" style="text-align:center; padding:40px; color:var(--silver-dim);">Chargement...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Products Tab -->
    <div id="productsTab" style="display:none;">
      <h2 class="section-title">Produits</h2>
      <div style="overflow-x:auto;">
        <table class="data-table" id="productsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nom</th>
              <th>SKU</th>
              <th>Prix</th>
              <th>Stock</th>
              <th>Statut</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="productsBody">
            <tr><td colspan="7" style="text-align:center; padding:40px; color:var(--silver-dim);">Chargement...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Order Detail Modal -->
<div class="order-detail-modal" id="orderModal">
  <div class="order-detail-content">
    <div class="order-detail-header">
      <h3>Détail de la commande #<span id="detailOrderId"></span></h3>
      <button class="order-detail-close" id="closeOrderModal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
    <div id="detailContent"></div>
  </div>
</div>

<script>
(async function(){
  const client = initSupabase();
  await requireAdmin();

  let allOrders = [];
  let allProducts = [];
  let currentFilter = 'all';

  // Logout
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await client.auth.signOut();
    window.location.href = 'index.html';
  });

  // Tabs
  document.querySelectorAll('.sidebar-link').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
      link.classList.add('active');
      const tab = link.dataset.tab;
      document.getElementById('ordersTab').style.display = tab === 'orders' ? '' : 'none';
      document.getElementById('productsTab').style.display = tab === 'products' ? '' : 'none';
    });
  });

  // Filter tabs
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderOrders();
    });
  });

  // Fetch stats
  async function loadStats() {
    const { data, error } = await client.rpc('get_admin_stats');
    if (error) { console.error(error); return; }
    const s = data[0];
    document.getElementById('statTotalOrders').textContent = s.total_orders;
    document.getElementById('statRevenue').textContent = formatPrice(s.total_revenue);
    document.getElementById('statPending').textContent = s.pending_orders;
    document.getElementById('statProducts').textContent = s.total_products;
  }

  // Fetch orders
  async function loadOrders() {
    const { data, error } = await client
      .from('orders')
      .select('*, order_items(*)')
      .order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    allOrders = data || [];
    renderOrders();
  }

  function renderOrders() {
    const tbody = document.getElementById('ordersBody');
    const filtered = currentFilter === 'all'
      ? allOrders
      : allOrders.filter(o => o.status === currentFilter);

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:40px; color:var(--silver-dim);">Aucune commande</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(o => `
      <tr>
        <td>#${o.id}</td>
        <td style="color:var(--white); font-weight:500;">${escapeHtml(o.full_name)}</td>
        <td>${escapeHtml(o.phone)}</td>
        <td>${escapeHtml(o.wilaya)}</td>
        <td style="color:var(--white); font-weight:600;">${formatPrice(o.total_amount)}</td>
        <td><span class="status-badge status-${o.status}">${statusLabel(o.status)}</span></td>
        <td>${new Date(o.created_at).toLocaleDateString('fr-FR')}</td>
        <td>
          <button class="btn-sm" onclick="openOrderDetail(${o.id})">Détails</button>
        </td>
      </tr>
    `).join('');
  }

  // Fetch products
  async function loadProducts() {
    const { data, error } = await client
      .from('products')
      .select('*')
      .order('id', { ascending: true });
    if (error) { console.error(error); return; }
    allProducts = data || [];
    renderProducts();
  }

  function renderProducts() {
    const tbody = document.getElementById('productsBody');
    if (allProducts.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:40px; color:var(--silver-dim);">Aucun produit</td></tr>`;
      return;
    }
    tbody.innerHTML = allProducts.map(p => `
      <tr>
        <td>#${p.id}</td>
        <td style="color:var(--white); font-weight:500;">${escapeHtml(p.name)}</td>
        <td>${escapeHtml(p.sku || '—')}</td>
        <td style="color:var(--white); font-weight:600;">${formatPrice(p.price)}</td>
        <td>${p.stock}</td>
        <td><span class="status-badge ${p.active ? 'status-confirmed' : 'status-cancelled'}">${p.active ? 'Actif' : 'Inactif'}</span></td>
        <td>
          <button class="btn-sm btn-ghost" onclick="toggleProduct(${p.id}, ${!p.active})">${p.active ? 'Désactiver' : 'Activer'}</button>
        </td>
      </tr>
    `).join('');
  }

  window.openOrderDetail = function(orderId) {
    const order = allOrders.find(o => o.id === orderId);
    if (!order) return;
    document.getElementById('detailOrderId').textContent = order.id;
    const content = document.getElementById('detailContent');
    content.innerHTML = `
      <div class="detail-row"><span>Client</span><span>${escapeHtml(order.full_name)}</span></div>
      <div class="detail-row"><span>Téléphone</span><span>${escapeHtml(order.phone)}</span></div>
      <div class="detail-row"><span>Wilaya</span><span>${escapeHtml(order.wilaya)}</span></div>
      <div class="detail-row"><span>Adresse</span><span>${escapeHtml(order.address || '—')}</span></div>
      <div class="detail-row"><span>Notes</span><span>${escapeHtml(order.notes || '—')}</span></div>
      <div class="detail-row"><span>Date</span><span>${new Date(order.created_at).toLocaleString('fr-FR')}</span></div>
      <div class="detail-row"><span>Montant total</span><span style="font-weight:700;">${formatPrice(order.total_amount)}</span></div>
      <div class="detail-items">
        <h4>Articles</h4>
        ${(order.order_items || []).map(item => `
          <div class="detail-item">
            <span>${escapeHtml(item.product_name)} × ${item.quantity}</span>
            <span>${formatPrice(item.price * item.quantity)}</span>
          </div>
        `).join('')}
      </div>
      <div style="margin-top:24px; display:flex; gap:10px; flex-wrap:wrap;">
        ${['pending','confirmed','shipped','delivered','cancelled'].map(s => `
          <button class="btn-sm ${order.status === s ? '' : 'btn-ghost'}" onclick="updateOrderStatus(${order.id}, '${s}')">${statusLabel(s)}</button>
        `).join('')}
      </div>
    `;
    document.getElementById('orderModal').classList.add('open');
  };

  window.updateOrderStatus = async function(orderId, status) {
    const { error } = await client.from('orders').update({ status }).eq('id', orderId);
    if (error) { alert('Erreur: ' + error.message); return; }
    await loadOrders();
    openOrderDetail(orderId);
  };

  window.toggleProduct = async function(productId, active) {
    const { error } = await client.from('products').update({ active }).eq('id', productId);
    if (error) { alert('Erreur: ' + error.message); return; }
    await loadProducts();
  };

  document.getElementById('closeOrderModal').addEventListener('click', () => {
    document.getElementById('orderModal').classList.remove('open');
  });
  document.getElementById('orderModal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('orderModal')) document.getElementById('orderModal').classList.remove('open');
  });

  function statusLabel(status) {
    const map = {
      pending: 'En attente',
      confirmed: 'Confirmée',
      shipped: 'Expédiée',
      delivered: 'Livrée',
      cancelled: 'Annulée'
    };
    return map[status] || status;
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  await loadStats();
  await loadOrders();
  await loadProducts();
})();
</script>
</body>
</html>
